name: Převod z originálu

on:
  schedule:
    - cron: "17 4 * * 1"   # každé pondělí ráno (UTC)
  workflow_dispatch: {}      # ruční spuštění z karty Actions

permissions:
  contents: write

jobs:
  prevod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install pyyaml

      - name: Stažení originálu
        run: |
          git clone --depth 1 https://github.com/LexaurinTheDog/riha-legal-plugins.git /tmp/original
          git -C /tmp/original rev-parse HEAD > /tmp/original-commit.txt

      - name: Převod
        run: python3 konverze/konverze.py /tmp/original /tmp/prevedeno

      - name: Nahrazení obsahu repozitáře
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name konverze ! -name README.md -exec rm -rf {} +
          cp -a /tmp/prevedeno/. ./
          cp /tmp/original-commit.txt konverze/original-commit.txt

      - name: Uložení změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Žádná změna v originálu."
          else
            git commit -m "Převod z originálu $(cut -c1-7 konverze/original-commit.txt)"
            git push
          fi
